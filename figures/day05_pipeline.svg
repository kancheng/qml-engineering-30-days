  <title id="title">Day 05: Classical and quantum forward pipelines</title>
  <desc id="desc">Classical: input, features, model, prediction, loss. Day 05: input x, angle pi x, RY and CNOT, counts, Z0 estimate, MSE. Training and optimizer are future work.</desc>
